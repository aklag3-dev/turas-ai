<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turas AI — Predictive Dispatch Dashboard</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --shadow: rgba(0, 0, 0, 0.1);
    }
    
    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-tertiary: #1a1a1a;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border: #2a2a2a;
      --shadow: rgba(0, 0, 0, 0.5);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      z-index: 1001;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--green);
    }
    
    .status-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-led 2s infinite;
    }
    
    .status-led.error {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }
    
    @keyframes pulse-led {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .header-center {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .city-select, .platform-select {
      padding: 0.5rem 0.75rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text-primary);
      font-size: 0.875rem;
      cursor: pointer;
    }
    
    .save-btn {
      padding: 0.5rem 1rem;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    
    .save-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    .save-btn:not(:disabled):hover {
      background: #16a34a;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .location-btn {
      padding: 0.5rem 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    
    .location-btn:hover {
      border-color: var(--green);
    }
    
    .location-btn.active {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    
    .theme-toggle {
      padding: 0.5rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1rem;
    }
    
    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 60px);
    }
    
    .left-rail {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1rem;
    }
    
    .map-container {
      position: relative;
    }
    
    #map {
      width: 100%;
      height: 100%;
    }
    
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .hub-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .hub-card:hover {
      border-color: var(--green);
      transform: translateX(2px);
    }
    
    .hub-card.selected {
      border-color: var(--green);
      background: rgba(34, 197, 94, 0.1);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
    }
    
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    
    .hub-name {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-primary);
    }
    
    .hub-type {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .pfare-badge {
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-weight: 700;
      font-size: 0.875rem;
    }
    
    .pfare-green { background: var(--green); color: white; }
    .pfare-amber { background: var(--amber); color: white; }
    .pfare-red { background: var(--red); color: white; }
    
    .hub-stats {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }
    
    .stat {
      display: flex;
      flex-direction: column;
    }
    
    .stat-label {
      font-size: 0.625rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    
    .stat-value {
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .score-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    
    .score-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    
    .weather-mini {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    
    .weather-icon {
      font-size: 1rem;
    }
    
    .transparency-notice {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      right: 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      z-index: 1000;
      box-shadow: 0 2px 8px var(--shadow);
    }
    
    .transparency-notice strong {
      color: var(--text-primary);
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
    }
    
    .spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .driver-marker {
      width: 20px;
      height: 20px;
      background: #3b82f6;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
      animation: pulse 2s infinite;
    }
    
    .hub-marker-highlight {
      animation: highlight-pulse 1s ease-in-out;
    }
    
    @keyframes highlight-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      
      .left-rail {
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      
      .app-header {
        padding: 0.5rem;
      }
      
      .header-center {
        order: 3;
        width: 100%;
        justify-content: space-between;
      }
      
      .city-select, .platform-select {
        flex: 1;
        font-size: 0.75rem;
        padding: 0.4rem;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="status-led" id="status-led"></div>
      <h1 class="app-title">Turas AI</h1>
    </div>
    <div class="header-center">
      <select id="city-select" class="city-select" onchange="onCityPlatformChange()">
        <option value="dublin">Dublin</option>
        <option value="cork">Cork</option>
        <option value="shannon">Shannon / Limerick</option>
      </select>
      <select id="platform-select" class="platform-select" onchange="onCityPlatformChange()">
        <option value="freenow">FreeNow (Taxi)</option>
        <option value="independent">Independent Taxi</option>
        <option value="uber">Uber</option>
        <option value="bolt">Bolt</option>
      </select>
      <button class="save-btn" id="save-btn" onclick="saveConfig()">Save</button>
    </div>
    <div class="header-right">
      <button class="location-btn" id="gps-btn" onclick="requestGPS()">📍 Allow GPS</button>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
  </header>

  <div class="container" id="app">
    <div class="left-rail">
      <div class="section-title">Hub Rankings</div>
      <div id="hub-list">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
      <div class="transparency-notice">
        <strong>AI Recommendation System (EU AI Act Article 50):</strong> Scores are generated by automated AI based on real-time transit data, weather, and demand patterns. Parameters are highlighted for explainability. No personal data is collected or stored.
      </div>
    </div>
  </div>

  <script type="module">
    import { TurasResearcher } from './agents/researcher-agent.js';
    import { TurasDesigner } from './agents/designer-agent.js';

    const WORKER_URL = 'https://turas-ai-proxy.symphony-driver-assist.workers.dev';

    const state = {
      sessionId: crypto.randomUUID(),
      city: localStorage.getItem('turas_city') || 'dublin',
      platform: localStorage.getItem('turas_platform') || 'freenow',
      selectedHub: null,
      matrix: null,
      brief: null,
      map: null,
      markers: {},
      routeLine: null,
      driverMarker: null,
      driverCoords: null,
      locationMode: 'demo',
      systemStatus: 'live',
      configSaved: true
    };

    const cityCoords = {
      dublin: [53.3498, -6.2603],
      cork: [51.8985, -8.4756],
      shannon: [52.7019, -8.9243]
    };

    const cityBounds = {
      dublin: { latMin: 53.2, latMax: 53.5, lngMin: -6.5, lngMax: -6.0 },
      cork: { latMin: 51.8, latMax: 52.0, lngMin: -8.6, lngMax: -8.3 },
      shannon: { latMin: 52.5, latMax: 52.8, lngMin: -9.1, lngMax: -8.7 }
    };

    // Initialize theme
    const savedTheme = localStorage.getItem('turas_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // Initialize selects
    document.getElementById('city-select').value = state.city;
    document.getElementById('platform-select').value = state.platform;

    // ─── Maker Agent ───
    function buildPayload(matrix, brief, driverCoords) {
      const geojson = {
        type: 'FeatureCollection',
        features: matrix.hubs.map(hub => ({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [hub.lng, hub.lat] },
          properties: {
            hubId: hub.hubId,
            name: hub.name,
            pFare: hub.pFare,
            pinColor: hub.pinColor,
            rank: hub.rank,
            nPax: hub.nPax,
            arrivals: hub.arrivals.length,
            rationale: hub.rationale
          }
        }))
      };

      const logObject = {
        sessionId: state.sessionId,
        timestamp: new Date().toISOString(),
        city: state.city,
        platform: state.platform,
        driverCoords: driverCoords ? { lat: driverCoords.lat, lng: driverCoords.lng } : null,
        selectedHub: state.selectedHub,
        topHubId: matrix.summary.topHubId,
        topPFare: matrix.summary.topPFare,
        hubCount: matrix.hubs.length,
        avgPFare: matrix.summary.avgPFare
      };

      const botContext = {
        topHub: matrix.hubs[0] ? {
          name: matrix.hubs[0].name,
          pFare: matrix.hubs[0].pFare,
          rationale: matrix.hubs[0].rationale,
          arrivals: matrix.hubs[0].arrivals.length
        } : null,
        weather: brief.hubs[0]?.weather || null,
        totalHubs: matrix.hubs.length
      };

      return { geojson, logObject, botContext };
    }

    // ─── Manager Agent ───
    function audit(matrix, brief, session) {
      const zeroPIICheck = {
        passed: true,
        violations: [],
        timestamp: new Date().toISOString()
      };

      const fields = [session, matrix, brief];
      const piiPatterns = [/@/, /\b\d{10}\b/, /\b[A-Z]{2}\d{3,}\b/];

      for (const field of fields) {
        const str = JSON.stringify(field);
        for (const pattern of piiPatterns) {
          if (pattern.test(str)) {
            zeroPIICheck.passed = false;
            zeroPIICheck.violations.push(`Pattern ${pattern} found`);
          }
        }
      }

      const yieldEstimate = calculateYieldEstimate(matrix);

      const executionLog = {
        sessionId: session.sessionId,
        timestamp: new Date().toISOString(),
        zeroPIICheck: zeroPIICheck.passed,
        yieldEstimate,
        auditComplete: true
      };

      return { zeroPIICheck, yieldEstimate, executionLog };
    }

    function calculateYieldEstimate(matrix) {
      if (!matrix.hubs || matrix.hubs.length === 0) return null;

      const topHub = matrix.hubs[0];
      const avgFare = 18;
      const currentWaitTime = 45;
      const optimizedWaitTime = Math.max(5, currentWaitTime * (1 - topHub.pFare / 100));
      const timeSaved = currentWaitTime - optimizedWaitTime;
      const extraFaresPerShift = Math.floor(timeSaved / 20);
      const yieldGain = extraFaresPerShift * avgFare;

      return {
        topHub: topHub.name,
        topPFare: topHub.pFare,
        timeSavedMinutes: timeSaved,
        extraFaresPerShift: extraFaresPerShift,
        yieldGainEuro: yieldGain,
        confidence: topHub.pFare >= 80 ? 'high' : topHub.pFare >= 50 ? 'medium' : 'low'
      };
    }

    // ─── Map Initialization ───
    function initMap() {
      state.map = L.map('map').setView(cityCoords[state.city], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(state.map);
    }

    // ─── Driver Marker ───
    function updateDriverMarker(lat, lng) {
      if (state.driverMarker) {
        state.driverMarker.setLatLng([lat, lng]);
      } else {
        state.driverMarker = L.marker([lat, lng], {
          icon: L.divIcon({
            className: 'driver-marker-wrapper',
            html: '<div class="driver-marker"></div>',
            iconSize: [20, 20]
          })
        }).addTo(state.map);
        state.driverMarker.bindPopup('Your location');
      }
      state.driverCoords = { lat, lng };
    }

    // ─── Route Polyline ───
    function drawRouteToHub(hub) {
      if (state.routeLine) {
        state.map.removeLayer(state.routeLine);
      }
      if (!state.driverCoords) return;

      state.routeLine = L.polyline([
        [state.driverCoords.lat, state.driverCoords.lng],
        [hub.lat, hub.lng]
      ], {
        color: '#22c55e',
        weight: 4,
        opacity: 0.7,
        dashArray: '10, 10'
      }).addTo(state.map);

      const distance = calculateDistance(
        state.driverCoords.lat, state.driverCoords.lng,
        hub.lat, hub.lng
      );
      const duration = Math.round(distance * 2);

      state.routeLine.bindPopup(`
        <strong>Route to ${hub.name}</strong><br>
        Distance: ${distance.toFixed(1)} km<br>
        Est. time: ${duration} mins
      `);
    }

    function calculateDistance(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // ─── Geolocation ───
    window.requestGPS = async function() {
      if (!navigator.geolocation) {
        alert('Geolocation not supported by your browser');
        return;
      }

      document.getElementById('gps-btn').classList.add('active');
      state.locationMode = 'gps';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          updateDriverMarker(position.coords.latitude, position.coords.longitude);
          state.map.setView([position.coords.latitude, position.coords.longitude], 13);
          await runPipeline();
        },
        (error) => {
          alert('Unable to get location: ' + error.message);
          document.getElementById('gps-btn').classList.remove('active');
          state.locationMode = 'demo';
          placeDemoDriver();
        }
      );
    };

    // ─── Demo Mode (Road-based) ───
    async function placeDemoDriver() {
      const bounds = cityBounds[state.city];
      const lat = bounds.latMin + Math.random() * (bounds.latMax - bounds.latMin);
      const lng = bounds.lngMin + Math.random() * (bounds.lngMax - bounds.lngMin);

      try {
        const resp = await fetch(`https://router.project-osrm.org/nearest/v1/driving/${lng},${lat}?number=1`);
        if (resp.ok) {
          const data = await resp.json();
          if (data.waypoints && data.waypoints.length > 0) {
            const waypoint = data.waypoints[0].location;
            updateDriverMarker(waypoint[1], waypoint[0]);
            state.map.setView([waypoint[1], waypoint[0]], 13);
            return;
          }
        }
      } catch (e) {
        console.warn('OSRM failed, using random coords:', e);
      }

      updateDriverMarker(lat, lng);
      state.map.setView([lat, lng], 13);
    }

    // ─── Hub List Rendering ───
    function renderHubList(matrix) {
      const container = document.getElementById('hub-list');
      container.innerHTML = matrix.hubs.map(hub => {
        const colorClass = hub.pFare >= 80 ? 'pfare-green' : hub.pFare >= 50 ? 'pfare-amber' : 'pfare-red';
        const selected = state.selectedHub === hub.hubId ? 'selected' : '';
        const barColor = hub.pFare >= 80 ? 'var(--green)' : hub.pFare >= 50 ? 'var(--amber)' : 'var(--red)';
        
        const hubType = hub.hubId.includes('airport') || hub.hubId.includes('ork') || hub.hubId.includes('snn') || hub.hubId.includes('dub-t') 
          ? 'Airport' 
          : hub.hubId.includes('port') || hub.hubId.includes('ringaskiddy') || hub.hubId.includes('foynes')
          ? 'Ferry Port'
          : 'Rail Station';
        
        const weather = hub.weather;
        const weatherIcon = weather.precipMmHr > 5 ? '🌧️' : weather.precipMmHr > 2 ? '🌦️' : weather.tempC <= 3 ? '❄️' : '☀️';
        
        return `
          <div class="hub-card ${selected}" onclick="selectHub('${hub.hubId}')" data-hub-id="${hub.hubId}">
            <div class="hub-header">
              <div>
                <div class="hub-name">${hub.name}</div>
                <div class="hub-type">${hubType}</div>
              </div>
              <div class="pfare-badge ${colorClass}">${hub.pFare}%</div>
            </div>
            <div class="hub-stats">
              <div class="stat">
                <span class="stat-label">Arrivals</span>
                <span class="stat-value">${hub.arrivals.length}</span>
              </div>
              <div class="stat">
                <span class="stat-label">N_pax</span>
                <span class="stat-value">${hub.nPax}</span>
              </div>
              <div class="stat">
                <span class="stat-label">Rank</span>
                <span class="stat-value">#${hub.rank}</span>
              </div>
            </div>
            <div class="score-bar">
              <div class="score-bar-fill" style="width: ${hub.pFare}%; background: ${barColor};"></div>
            </div>
            <div class="weather-mini">
              <span class="weather-icon">${weatherIcon}</span>
              <span>${weather.tempC}°C · ${weather.precipMmHr}mm/hr</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // ─── Map Markers ───
    function renderMapMarkers(matrix) {
      Object.values(state.markers).forEach(m => state.map.removeLayer(m));
      state.markers = {};

      matrix.hubs.forEach(hub => {
        const marker = L.marker([hub.lat, hub.lng], {
          icon: L.divIcon({
            className: 'custom-marker',
            html: `<div style="background: ${hub.pinColor}; width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: transform 0.3s;"></div>`,
            iconSize: [24, 24]
          })
        }).addTo(state.map);

        marker.bindPopup(`
          <strong>${hub.name}</strong><br>
          P_fare: ${hub.pFare}%<br>
          Arrivals: ${hub.arrivals.length}<br>
          Weather: ${hub.weather.precipMmHr}mm/hr, ${hub.weather.tempC}°C<br>
          ${hub.rationale}
        `);

        state.markers[hub.hubId] = marker;
      });
    }

    // ─── Hub Selection ───
    window.selectHub = function(hubId) {
      state.selectedHub = hubId;
      renderHubList(state.matrix);

      const hub = state.matrix.hubs.find(h => h.hubId === hubId);
      if (hub) {
        state.map.setView([hub.lat, hub.lng], 13);
        drawRouteToHub(hub);
        
        const marker = state.markers[hubId];
        if (marker) {
          const el = marker.getElement();
          if (el) {
            el.querySelector('div').classList.add('hub-marker-highlight');
            setTimeout(() => {
              el.querySelector('div').classList.remove('hub-marker-highlight');
            }, 1000);
          }
        }
      }
    };

    // ─── Config Save ───
    window.onCityPlatformChange = function() {
      state.configSaved = false;
      document.getElementById('save-btn').disabled = false;
    };

    window.saveConfig = async function() {
      state.city = document.getElementById('city-select').value;
      state.platform = document.getElementById('platform-select').value;
      
      localStorage.setItem('turas_city', state.city);
      localStorage.setItem('turas_platform', state.platform);
      
      state.configSaved = true;
      document.getElementById('save-btn').disabled = true;
      
      state.map.setView(cityCoords[state.city], 11);
      await runPipeline();
    };

    // ─── Theme Toggle ───
    window.toggleTheme = function() {
      const current = document.documentElement.getAttribute('data-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('turas_theme', newTheme);
    };

    // ─── Status LED ───
    function updateStatusLED(status) {
      state.systemStatus = status;
      const led = document.getElementById('status-led');
      if (status === 'error') {
        led.classList.add('error');
      } else {
        led.classList.remove('error');
      }
    }

    // ─── Main Pipeline ───
    async function runPipeline() {
      try {
        updateStatusLED('live');
        
        const researcher = new TurasResearcher();
        state.brief = await researcher.collect({
          city: state.city,
          platform: state.platform,
          sessionId: state.sessionId
        });

        const designer = new TurasDesigner(state.brief);
        state.matrix = await designer.evaluate();

        const payload = buildPayload(state.matrix, state.brief, state.driverCoords);
        const auditResult = audit(state.matrix, state.brief, state);

        renderHubList(state.matrix);
        renderMapMarkers(state.matrix);

        const logs = JSON.parse(localStorage.getItem('turas_logs') || '[]');
        logs.push(payload.logObject);
        localStorage.setItem('turas_logs', JSON.stringify(logs.slice(-100)));

        if (state.matrix.hubs.length > 0) {
          selectHub(state.matrix.hubs[0].hubId);
        }
      } catch (err) {
        console.error('[Turas AI] Pipeline error:', err);
        updateStatusLED('error');
      }
    }

    // ─── Init ───
    initMap();
    
    if (state.locationMode === 'demo') {
      placeDemoDriver();
    }
    
    runPipeline();

    setInterval(() => {
      runPipeline();
    }, 300000);
  </script>
</body>
</html>
